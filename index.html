<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Assistant</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #0b1020; color: #e6f1ff;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 14px; display: flex; justify-content: space-between; align-items: center; background: #111a33; border-bottom: 1px solid #1f2b4d; }
  header h1 { margin: 0; font-size: 20px; color: #64ffda; }
  #log { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { margin: 8px 0; padding: 10px 14px; border-radius: 12px; max-width: 85%; line-height: 1.4; white-space: pre-line; }
  .user { background: #1f3a68; margin-left: auto; }
  .bot { background: #15213f; border: 1px solid #22345e; }
  .bar { display: flex; gap: 8px; padding: 10px; background: #111a33; border-top: 1px solid #1f2b4d; }
  input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid #2a3b66; background: #0b1020; color: #e6f1ff; font-size: 16px; }
  button { padding: 12px 14px; border: none; border-radius: 10px; background: #64ffda; color: #0b1020; font-size: 16px; font-weight: bold; }
  button.listening { background: #ff6b6b; }
  #langBtn { background: #1f3a68; color: #e6f1ff; }
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <button id="langBtn">EN</button>
</header>
<div id="log"></div>
<div class="bar">
  <input id="cmd" placeholder="Type a command..." autocomplete="off">
  <button id="mic">🎤</button>
  <button id="send">Go</button>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('cmd');
const micBtn = document.getElementById('mic');
const langBtn = document.getElementById('langBtn');

const LANGS = [
  { code: 'en-IN', label: 'EN' },
  { code: 'hi-IN', label: 'हिंदी' },
  { code: 'kn-IN', label: 'ಕನ್ನಡ' }
];
let li = 0;
let LANG = LANGS[0].code;

const MSG = {
  'en-IN': {
    hello: 'Hello sir. How can I help you today?',
    time: 'The time is ',
    date: 'Today is ',
    opening: 'Opening ',
    searching: 'Searching for ',
    saved: 'Saved: ',
    noNotes: 'You have no notes.',
    cleared: 'All notes cleared.',
    timerHelp: 'Say something like: timer 5 minutes',
    timerSet: 'Timer set for ',
    timeUp: 'Time is up!',
    unknown: 'Sorry, I did not understand. Type help for commands.',
    noSite: 'I do not know that site yet. Try: ',
    online: 'Jarvis online. Type help to see what I can do.',
    help: 'Commands: time, date, open youtube, search something, timer 5 minutes, note something, show notes, clear notes.',
    langOn: 'English selected.'
  },
  'hi-IN': {
    hello: 'नमस्ते सर। मैं आपकी कैसे मदद कर सकता हूँ?',
    time: 'अभी समय है ',
    date: 'आज की तारीख है ',
    opening: 'खोल रहा हूँ ',
    searching: 'खोज रहा हूँ ',
    saved: 'नोट सेव हो गया: ',
    noNotes: 'आपके कोई नोट नहीं हैं।',
    cleared: 'सारे नोट हटा दिए गए।',
    timerHelp: 'ऐसे बोलें: टाइमर 5 मिनट',
    timerSet: 'टाइमर सेट हो गया: ',
    timeUp: 'समय पूरा हो गया!',
    unknown: 'माफ़ कीजिए, मैं समझ नहीं पाया। मदद के लिए "मदद" लिखें।',
    noSite: 'यह साइट अभी नहीं जानता। ऐसे बोलें: ',
    online: 'जार्विस चालू है। "मदद" लिखें।',
    help: 'कमांड: समय, तारीख, खोलो youtube, खोजो कुछ भी, टाइमर 5 मिनट, नोट कुछ भी, नोट्स दिखाओ, नोट्स साफ करो।',
    langOn: 'हिंदी चुनी गई है।'
  }
};
MSG['kn-IN'] = { ...MSG['en-IN'], langOn: 'ಕನ್ನಡ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.' };

langBtn.onclick = () => {
  li = (li + 1) % LANGS.length;
  LANG = LANGS[li].code;
  langBtn.textContent = LANGS[li].label;
  if (rec) rec.lang = LANG;
  say(MSG[LANG].langOn);
};

function say(text) {
  addMsg(text, 'bot');
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG;
    speechSynthesis.speak(u);
  }
}

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

const sites = {
  youtube: 'https://www.youtube.com',
  google: 'https://www.google.com',
  whatsapp: 'https://web.whatsapp.com',
  instagram: 'https://www.instagram.com',
  gmail: 'https://mail.google.com',
  maps: 'https://maps.google.com'
};

function handle(raw) {
  const M = MSG[LANG];
  const c = raw.toLowerCase().replace(/[?!.,।]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!c) return;
  addMsg(raw, 'user');

  // Matches whole words. Works for Hindi words too, since \b does not work for Devanagari.
  const has = (...w) => w.some(x => (' ' + c + ' ').includes(' ' + x + ' '));

  // Timer (checked first so "timer" is not read as "time")
  if (/^(timer|टाइमर)/.test(c)) {
    const m = c.match(/(\d+)\s*(second|sec|सेकंड|minute|min|मिनट)/);
    if (!m) return say(M.timerHelp);
    const isSec = /^(second|sec|सेकंड)/.test(m[2]);
    const secs = isSec ? +m[1] : +m[1] * 60;
    const unit = LANG === 'hi-IN' ? (isSec ? 'सेकंड' : 'मिनट') : (isSec ? 'seconds' : 'minutes');
    say(M.timerSet + m[1] + ' ' + unit);
    setTimeout(() => say(M.timeUp), secs * 1000);
    return;
  }

  // Notes
  if (c === 'show notes' || c === 'my notes' || c.includes('नोट्स दिखाओ') || c.includes('नोट्स बताओ')) {
    const notes = JSON.parse(localStorage.getItem('notes') || '[]');
    return say(notes.length ? notes.map((n, i) => (i + 1) + '. ' + n).join('\n') : M.noNotes);
  }
  if (c === 'clear notes' || c.includes('नोट्स साफ')) {
    localStorage.removeItem('notes');
    return say(M.cleared);
  }
  if (/^(note|remind me to|नोट|याद रखो)\s/.test(c)) {
    const note = c.replace(/^(note|remind me to|नोट|याद रखो)\s+/, '');
    const notes = JSON.parse(localStorage.getItem('notes') || '[]');
    notes.push(note);
    localStorage.setItem('notes', JSON.stringify(notes));
    return say(M.saved + note);
  }

  // Greeting
  if (has('hi', 'hello', 'hey', 'namaste', 'jarvis', 'नमस्ते', 'नमस्कार', 'हैलो', 'हाय')) {
    return say(M.hello);
  }

  // Time and date
  if (has('time', 'समय', 'टाइम', 'बजे')) {
    return say(M.time + new Date().toLocaleTimeString(LANG, { hour: '2-digit', minute: '2-digit' }));
  }
  if (has('date', 'today', 'तारीख', 'आज', 'दिनांक')) {
    return say(M.date + new Date().toLocaleDateString(LANG, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
  }

  // Open a site (works as "open youtube" or "youtube खोलो")
  const om = c.match(/^(?:open|खोलो|खोल)\s+(.+)$/) || c.match(/^(.+?)\s+(?:खोलो|खोल|open)$/);
  if (om) {
    const name = om[1].trim();
    if (sites[name]) {
      window.open(sites[name], '_blank');
      return say(M.opening + name);
    }
    return say(M.noSite + Object.keys(sites).join(', '));
  }

  // Search (works as "search cats" or "बिल्लियाँ खोजो")
  const sm = c.match(/^(?:search|google|खोजो|सर्च)\s+(.+)$/) || c.match(/^(.+?)\s+(?:खोजो|सर्च|search)$/);
  if (sm) {
    const q = sm[1].trim();
    window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
    return say(M.searching + q);
  }

  if (has('help', 'मदद')) return say(M.help);

  say(M.unknown);
}

document.getElementById('send').onclick = () => { handle(input.value); input.value = ''; };
input.addEventListener('keydown', e => { if (e.key === 'Enter') { handle(input.value); input.value = ''; } });

// Voice input
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = LANG;
  rec.continuous = false;
  rec.onresult = e => handle(e.results[0][0].transcript);
  rec.onend = () => micBtn.classList.remove('listening');
  rec.onerror = () => micBtn.classList.remove('listening');
  micBtn.onclick = () => {
    micBtn.classList.add('listening');
    rec.lang = LANG;
    try { rec.start(); } catch (e) {}
  };
} else {
  micBtn.onclick = () => say(LANG === 'hi-IN' ? 'वॉइस के लिए Chrome चाहिए।' : 'Voice input needs Chrome on Android.');
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

say(MSG[LANG].online);
</script>
</body>
</html>
