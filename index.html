<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Assistant</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #0b1020; color: #e6f1ff;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 14px; display: flex; justify-content: space-between; align-items: center; background: #111a33; border-bottom: 1px solid #1f2b4d; }
  header h1 { margin: 0; font-size: 20px; color: #64ffda; }
  #log { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { margin: 8px 0; padding: 10px 14px; border-radius: 12px; max-width: 85%; line-height: 1.4; white-space: pre-line; }
  .user { background: #1f3a68; margin-left: auto; }
  .bot { background: #15213f; border: 1px solid #22345e; }
  .bar { display: flex; gap: 8px; padding: 10px; background: #111a33; border-top: 1px solid #1f2b4d; }
  input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid #2a3b66; background: #0b1020; color: #e6f1ff; font-size: 16px; }
  button { padding: 12px 14px; border: none; border-radius: 10px; background: #64ffda; color: #0b1020; font-size: 16px; font-weight: bold; }
  button.listening { background: #ff6b6b; }
  #langBtn { background: #1f3a68; color: #e6f1ff; }
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <button id="langBtn">EN</button>
</header>
<div id="log"></div>
<div class="bar">
  <input id="cmd" placeholder="Type a command..." autocomplete="off">
  <button id="mic">🎤</button>
  <button id="send">Go</button>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('cmd');
const micBtn = document.getElementById('mic');
const langBtn = document.getElementById('langBtn');

let LANG = 'en-IN';
langBtn.onclick = () => {
  LANG = LANG === 'en-IN' ? 'kn-IN' : 'en-IN';
  langBtn.textContent = LANG === 'en-IN' ? 'EN' : 'ಕನ್ನಡ';
  if (rec) rec.lang = LANG;
  say(LANG === 'en-IN' ? 'English selected.' : 'ಕನ್ನಡ ಆಯ್ಕೆ ಮಾಡಲಾಗಿದೆ.');
};

function say(text) {
  addMsg(text, 'bot');
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG;
    speechSynthesis.speak(u);
  }
}

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

const sites = {
  youtube: 'https://www.youtube.com',
  google: 'https://www.google.com',
  whatsapp: 'https://web.whatsapp.com',
  instagram: 'https://www.instagram.com',
  gmail: 'https://mail.google.com',
  maps: 'https://maps.google.com'
};

function handle(raw) {
  const c = raw.toLowerCase().trim();
  if (!c) return;
  addMsg(raw, 'user');

  // Timer first, so "timer 5 minutes" is not read as "time"
  if (c.startsWith('timer ')) {
    const m = c.match(/(\d+)\s*(second|sec|minute|min)/);
    if (!m) return say('Say something like: timer 5 minutes');
    const isSec = m[2].startsWith('sec');
    const secs = isSec ? +m[1] : +m[1] * 60;
    say('Timer set for ' + m[1] + ' ' + (isSec ? 'seconds' : 'minutes') + '.');
    setTimeout(() => say('Time is up!'), secs * 1000);
    return;
  }
  if (/\b(hi|hello|hey|namaste|jarvis)\b/.test(c)) {
    return say('Hello sir. How can I help you today?');
  }
  if (/\btime\b/.test(c)) {
    return say('The time is ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }));
  }
  if (/\b(date|today)\b/.test(c)) {
    return say('Today is ' + new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
  }
  if (c.startsWith('open ')) {
    const name = c.slice(5).trim();
    if (sites[name]) { window.open(sites[name], '_blank'); return say('Opening ' + name); }
    return say('I do not know ' + name + ' yet. Try: ' + Object.keys(sites).join(', '));
  }
  if (c.startsWith('search ') || c.startsWith('google ')) {
    const q = c.replace(/^(search|google) /, '');
    window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
    return say('Searching for ' + q);
  }
  if (c.startsWith('remind me to ') || c.startsWith('note ')) {
    const note = c.replace(/^(remind me to |note )/, '');
    const notes = JSON.parse(localStorage.getItem('notes') || '[]');
    notes.push(note);
    localStorage.setItem('notes', JSON.stringify(notes));
    return say('Saved: ' + note);
  }
  if (c === 'show notes' || c === 'my notes') {
    const notes = JSON.parse(localStorage.getItem('notes') || '[]');
    return say(notes.length ? notes.map((n, i) => (i + 1) + '. ' + n).join('\n') : 'You have no notes.');
  }
  if (c === 'clear notes') {
    localStorage.removeItem('notes');
    return say('All notes cleared.');
  }
  if (c === 'help') {
    return say('Commands:\n- time, date\n- open youtube (or whatsapp, instagram, gmail, maps)\n- search something\n- timer 5 minutes\n- note something\n- show notes, clear notes');
  }
  say('Sorry, I did not understand. Type help for commands.');
}

document.getElementById('send').onclick = () => { handle(input.value); input.value = ''; };
input.addEventListener('keydown', e => { if (e.key === 'Enter') { handle(input.value); input.value = ''; } });

// Voice input
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = LANG;
  rec.continuous = false;
  rec.onresult = e => handle(e.results[0][0].transcript);
  rec.onend = () => micBtn.classList.remove('listening');
  rec.onerror = () => micBtn.classList.remove('listening');
  micBtn.onclick = () => { micBtn.classList.add('listening'); rec.lang = LANG; rec.start(); };
} else {
  micBtn.onclick = () => say('Voice input needs Chrome on Android.');
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

say('Jarvis online. Type help to see what I can do.');
</script>
</body>
</html>
